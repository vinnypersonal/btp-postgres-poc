_schema-version: '3.1'
ID: btp-postgres-poc
version: 1.0.0
description: CAP Sales Order POC with PostgreSQL and S/4HANA integration

parameters:
  enable-parallel-deployments: true

# ─── Modules ──────────────────────────────────────────────────────────────────

modules:

  # ── CAP Backend (Node.js) ────────────────────────────────────────────────────
  - name: btp-postgres-poc-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    properties:
      EXIT: 1
      NODE_ENV: production
      # Both deployer and srv MUST use the same schema name so they see the same tables.
      # db-setup.js creates schema "btppgpoc" and grants PUBLIC access.
      CDS_REQUIRES_DB_CREDENTIALS_SCHEMA: btppgpoc
    build-parameters:
      builder: npm
      build-result: .
      ignore: [node_modules/, .env, .cdsrc-private.json]
    requires:
      - name: btp-postgres-poc-db        # existing postgres
      - name: btp-postgres-poc-xsuaa     # new xsuaa for this app
      - name: btp-postgres-poc-dest      # existing destination (has SHD250SYSTEM)
      - name: btp-postgres-poc-conn      # existing connectivity (for Cloud Connector)
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ── DB Schema Deployer ───────────────────────────────────────────────────────
  # ONE-SHOT task runner — deploys CDS schema to PostgreSQL.
  # DO NOT start this manually from BTP cockpit. It runs only as a CF task
  # during `cf deploy`. After the task completes it stays STOPPED — that is correct.
  - name: btp-postgres-poc-db-deployer
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      no-route: true
      no-start: true
      health-check-type: none         # prevents CF from trying to health-check a web process
      tasks:
        - name: deploy-to-postgres
          command: node db-setup.js
          memory: 512M
    build-parameters:
      builder: npm
      build-result: .
      ignore: [node_modules/, .env]
    requires:
      - name: btp-postgres-poc-db
      - name: btp-postgres-poc-xsuaa  # bound so cds-serve doesn't fail if started accidentally

# ─── Resources ────────────────────────────────────────────────────────────────

resources:

  # ── PostgreSQL — reuse existing zepcappg-postgres ────────────────────────────
  - name: btp-postgres-poc-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: zepcappg-postgres

  # ── XSUAA — new instance for this app ────────────────────────────────────────
  - name: btp-postgres-poc-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: btp-postgres-poc
        tenant-mode: dedicated

  # ── Destination — reuse existing zepcappg-destination-service ────────────────
  # (SHD250SYSTEM destination must be configured in this service instance)
  - name: btp-postgres-poc-dest
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: zepcappg-destination-service

  # ── Connectivity — reuse existing (for Cloud Connector / on-premise S/4HANA) ─
  - name: btp-postgres-poc-conn
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: CreateJournal-connectivity
