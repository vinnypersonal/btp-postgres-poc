_schema-version: '3.1'
ID: btp-postgres-poc
version: 1.0.0
description: CAP Sales Order POC with PostgreSQL and S/4HANA integration

parameters:
  enable-parallel-deployments: true

# ─── Modules ──────────────────────────────────────────────────────────────────

modules:

  # ── CAP Backend ─────────────────────────────────────────────────────────────
  - name: btp-postgres-poc-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    properties:
      EXIT: 1
    build-parameters:
      builder: npm
      build-result: .
      ignore: [node_modules/, .env]
    requires:
      - name: btp-postgres-poc-db
      - name: btp-postgres-poc-xsuaa
      - name: btp-postgres-poc-destination
      - name: btp-postgres-poc-connectivity
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ── Fiori / HTML5 UI ────────────────────────────────────────────────────────
  - name: btp-postgres-poc-app
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: btp-postgres-poc-xsuaa
      - name: srv-api
        group: destinations
        properties:
          name: backend
          url: ~{srv-url}
          forwardAuthToken: true

# ─── Resources ────────────────────────────────────────────────────────────────

resources:

  # ── PostgreSQL (BTP PostgreSQL Hyperscaler Option) ───────────────────────
  - name: btp-postgres-poc-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db          # BTP PostgreSQL Hyperscaler Option
      service-plan: trial             # Use 'standard' or 'premium' for production
      config:
        engine_version: '14'

  # ── XSUAA (Authentication) ──────────────────────────────────────────────
  - name: btp-postgres-poc-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  # ── Destination Service (for S/4HANA connectivity) ──────────────────────
  - name: btp-postgres-poc-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # ── Connectivity Service (for on-premise S/4HANA via Cloud Connector) ───
  - name: btp-postgres-poc-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
